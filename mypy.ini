# mypy config — strict typing for Triport SDK.
# `mypy triport/` is the CI gate (sdk-smoke-py job).
[mypy]
python_version = 3.10
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
no_implicit_optional = True
check_untyped_defs = True
show_error_codes = True
pretty = True

# Generated code skips strict-typing review — the generator owns its
# own emission contract; bugs there are caught by the gen-* --check.
[mypy-triport.generated.*]
disallow_any_generics = False
disallow_untyped_defs = False

# Third-party packages that ship no .pyi:
[mypy-websockets.*]
ignore_missing_imports = True
