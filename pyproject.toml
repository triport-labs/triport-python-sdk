[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "triport"
version = "0.1.0a0"
description = "Triport Python SDK for multi-chain JSON-RPC, REST helpers and WebSocket subscriptions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Triport Labs", email = "sales@triport.io" }]
keywords = ["triport", "solana", "ethereum", "polygon", "json-rpc", "websocket", "sdk", "grpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0", "websockets>=13.0", "pydantic>=2.7.0"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "build>=1.2.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://triport.io/docs"
Documentation = "https://triport.io/docs"
Source = "https://github.com/triport-labs/triport-python-sdk"
Issues = "https://github.com/triport-labs/triport-python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["triport"]

[tool.hatch.build.targets.sdist]
include = [
    "triport/**", "tests/**", "scripts/**", "examples/**", "ruff.toml", "mypy.ini",
    "CONTRIBUTING.md", "SECURITY.md", "REPO.json", "README.md", "LICENSE", "pyproject.toml",
    ".github/workflows/ci.yml", ".gitignore",
]
exclude = ["*.lock", "**/__pycache__/**", "**/*.pyc", ".pytest_cache/**", ".ruff_cache/**", ".mypy_cache/**"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: opt-in public API reads; requires TRIPORT_STAGING_URL and TRIPORT_CONTRACT_KEY.",
]
